<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خلاصة — شاشا تك سوليوشنز</title>
<meta name="description" content="خلاصة: لخّص محاضراتك واستخرج الأسئلة وترجم المصطلحات وذاكر بالبطاقات، حتى دون إنترنت.">
<meta name="theme-color" content="#0a2246">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خلاصة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
:root{
  /* ألوان شعار شاشا تك سوليوشنز: كحلي #0A2246 وبرتقالي #F7821B */
  --bg:#f4f6fa;--surface:#ffffff;--surface-2:#edf1f7;--text:#0f1d35;--muted:#56637a;--border:#d8dfeb;
  --primary:#0a2246;--primary-ink:#ffffff;--primary-soft:#e5ebf5;--accent:#f7821b;--accent-ink:#0a2246;--accent-soft:#fff0e2;--accent-strong:#c95e06;
  --danger:#b42318;--danger-soft:#fde7e5;--success:#167a3e;--success-soft:#dff5e7;--shadow:0 1px 2px rgba(10,34,70,.06),0 4px 14px rgba(10,34,70,.07);
  --radius:14px;--fs:16px;--nav-h:64px;
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,"Geeza Pro","Arial",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111f;--surface:#0f1b30;--surface-2:#17253f;--text:#e8edf6;--muted:#a0b0c8;--border:#263654;
  --primary:#9cbcf2;--primary-ink:#08111f;--primary-soft:#1a2c4c;--accent:#f7821b;--accent-ink:#0a1424;--accent-soft:#3a2614;--accent-strong:#ffa354;
  --danger:#ff8a80;--danger-soft:#3b1d1b;--success:#6fdb98;--success-soft:#173826;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08111f;--surface:#0f1b30;--surface-2:#17253f;--text:#e8edf6;--muted:#a0b0c8;--border:#263654;
  --primary:#9cbcf2;--primary-ink:#08111f;--primary-soft:#1a2c4c;--accent:#f7821b;--accent-ink:#0a1424;--accent-soft:#3a2614;--accent-strong:#ffa354;
  --danger:#ff8a80;--danger-soft:#3b1d1b;--success:#6fdb98;--success-soft:#173826;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.75;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.hidden{display:none!important}
.u-text{unicode-bidi:plaintext;white-space:pre-wrap;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--border);padding:3px;object-fit:contain;flex:none}
.brand-name{font-weight:800;font-size:1.15rem;line-height:1.1}
.brand-sub{font-size:.72rem;color:var(--accent-strong);font-weight:600;line-height:1.2;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;font-weight:700}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.net-pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-size:.8rem;white-space:nowrap}
.net-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--success)}
.net-pill.off .dot{background:var(--muted)}
.timer-chip{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--accent-soft);color:var(--text);font-size:.85rem;font-variant-numeric:tabular-nums}
@media (max-width:420px){.net-label{display:none}.net-pill{padding:0 9px}.icon-btn{width:36px;height:36px}.top-actions{gap:2px}.topbar{padding-inline:12px}}
@media (max-width:330px){.brand-sub{display:none}}

/* Layout */
main{max-width:860px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{line-height:1.4;margin:0 0 .5em}
.page-title{font-size:1.3rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.stack>*+*{margin-top:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;text-align:center;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--primary-soft);border-color:transparent;color:var(--text)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-lg{min-height:54px;font-size:1.05rem;width:100%}
.btn-sm{min-height:36px;padding:4px 12px;font-size:.88rem;border-radius:10px}
.btn svg{width:20px;height:20px;flex:none}
.link-btn{background:none;border:0;color:var(--primary);text-decoration:underline;padding:6px 2px;font-weight:600}

/* New lecture */
.input-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.method{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:.92rem;box-shadow:var(--shadow)}
.method svg{width:26px;height:26px;color:var(--accent-strong)}
.method:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:.88rem}
.chip[aria-pressed="true"],.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip-static{min-height:auto;padding:2px 10px;font-size:.8rem;background:var(--surface-2);border-color:transparent}
.big-label{display:block;font-size:1.2rem;font-weight:800;margin:14px 0 6px}
textarea.main-input{width:100%;min-height:42vh;padding:14px;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface);line-height:1.8;resize:vertical;unicode-bidi:plaintext}
textarea.main-input:focus{border-color:var(--primary);outline:none}
.meta-line{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-size:.85rem;color:var(--muted)}
details.more{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:4px 12px}
details.more summary{cursor:pointer;padding:8px 0;font-weight:600;color:var(--muted)}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.input{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);unicode-bidi:plaintext}
.input:focus{border-color:var(--primary);outline:none}
.primary-actions{display:grid;gap:10px}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin:12px 0 4px}
.rec-panel{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--danger-soft);margin-bottom:12px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Busy */
.busy{position:sticky;top:57px;z-index:25;margin:0 auto;max-width:860px;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:.92rem}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:1;max-width:160px}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* Lecture view */
.lec-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.lec-head h2{font-size:1.2rem;margin:4px 0 2px;unicode-bidi:plaintext}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:57px;z-index:5;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:40px;padding:4px 14px;border:0;background:transparent;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.rich h4{font-size:1rem;margin:14px 0 4px;color:var(--primary);border-inline-start:3px solid var(--accent);padding-inline-start:8px}
.rich p{margin:0 0 10px}
.rich ul{margin:0 0 10px;padding-inline-start:22px}
.rich li{margin-bottom:6px}
.rich li,.rich p,.rich h4{unicode-bidi:plaintext}
.ai-note{font-size:.78rem;color:var(--muted);margin-top:4px}
.export-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.export-bar .btn{min-height:46px;font-size:.85rem;flex-direction:column;gap:2px;padding:4px}
.banner{padding:12px 14px;border-radius:12px;background:var(--primary-soft);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--accent-soft)}
.term{border-bottom:1px dashed var(--border);padding:10px 0}
.term:last-child{border-bottom:0}
.term b{unicode-bidi:plaintext}
.term-alt{font-size:.85rem;color:var(--muted);margin-inline-start:6px;direction:ltr;unicode-bidi:isolate}
.outline li{list-style:none;margin:4px 0}
.outline .ol-title{font-weight:700;unicode-bidi:plaintext}
.outline .ol-point{font-size:.9rem;color:var(--muted);unicode-bidi:plaintext}
.outline{padding:0;margin:0}

/* Quiz */
.score-bar{position:sticky;top:110px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px;box-shadow:var(--shadow)}
.score-num{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.q-group-title{font-size:1rem;margin:18px 0 8px;color:var(--muted)}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.q-text{font-weight:700;margin-bottom:10px;unicode-bidi:plaintext}
.opts{display:grid;gap:8px}
.opt{text-align:start;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);unicode-bidi:plaintext;line-height:1.6}
.opt:disabled{cursor:default}
.opt.correct{background:var(--success-soft);border-color:var(--success);font-weight:700}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger)}
.feedback{margin-top:10px;font-size:.92rem;padding:8px 12px;border-radius:10px;unicode-bidi:plaintext}
.feedback.ok{background:var(--success-soft)}
.feedback.bad{background:var(--danger-soft)}
.answer-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--primary-soft)}

/* Translation */
.pair-grid{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair>div{padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);unicode-bidi:plaintext;white-space:pre-wrap;overflow-wrap:anywhere}
.pair>div.tr{background:var(--primary-soft);border-color:transparent}
.pair-head{font-size:.8rem;color:var(--muted);font-weight:700}
.pair-h>div{font-weight:800}
.pair>div.pending{opacity:.55;font-style:italic}
mark.gl{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}
.gl-tr{font-size:.82em;color:var(--primary);font-weight:700;unicode-bidi:isolate}
@media (max-width:560px){.pair{grid-template-columns:1fr}.pair-head .tr-h{display:none}}
table.simple{width:100%;border-collapse:collapse;font-size:.92rem}
table.simple th,table.simple td{padding:8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
table.simple td{unicode-bidi:plaintext}
table.simple th{color:var(--muted);font-weight:700;font-size:.82rem}
.table-wrap{overflow-x:auto}

/* Library */
.lib-item{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.lib-item:hover{border-color:var(--primary)}
.lib-title{font-weight:700;unicode-bidi:plaintext}
.lib-meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lib-snippet{font-size:.85rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
.month-h{font-size:.85rem;color:var(--muted);margin:16px 4px 6px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty svg{width:48px;height:48px;opacity:.5}

/* Flashcards */
.flash{perspective:1000px;margin:12px 0}
.flash-inner{position:relative;min-height:240px;transition:transform .4s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto;unicode-bidi:plaintext}
.flash-face.back{transform:rotateY(180deg);background:var(--primary-soft)}
.flash-front-text{font-size:1.35rem;font-weight:800}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade .btn{flex-direction:column;gap:0;font-size:.9rem;min-height:58px}
.grade small{font-weight:400;color:inherit;opacity:.8;font-size:.75rem}
.stat-row{display:flex;gap:10px}
.stat{flex:1;padding:10px;border-radius:12px;background:var(--surface-2);text-align:center}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* Pomodoro */
.pomo{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;inset-inline:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{height:var(--nav-h);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;font-weight:600;color:var(--muted)}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-current="page"]{color:var(--primary);box-shadow:inset 0 3px 0 var(--accent)}
.nav-btn .badge{position:absolute;margin-inline-start:26px;margin-top:-26px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px}
@media (min-width:900px){.bottom-nav{max-width:520px;margin:0 auto 12px;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}}

/* Modal + toast */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(5,15,18,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@media (min-width:640px){.modal-back{align-items:center;padding:16px}.modal{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal-head h3{margin:0;font-size:1.1rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toasts{position:fixed;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));inset-inline:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:520px;width:100%;padding:12px 14px;border-radius:12px;background:var(--text);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.92rem;animation:up .2s ease}
.toast.warn{background:var(--accent);color:var(--accent-ink)}
.toast.error{background:var(--danger);color:#fff}
.toast.ok{background:var(--success);color:#fff}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:2px 10px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:10px}
.check input{width:20px;height:20px}
.yes{color:var(--success);font-weight:700}.no{color:var(--danger);font-weight:700}.maybe{color:var(--accent-strong);font-weight:700}
#printArea{display:none}
/* توقيع الشركة أسفل التطبيق */
.credit{text-align:center;margin:28px 0 6px}
.credit a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.85rem;text-decoration:none;box-shadow:var(--shadow)}
.credit a:hover{border-color:var(--accent)}
.credit b{color:var(--primary);font-weight:800}
.credit svg{width:20px;height:20px;color:#1faa53;flex:none}

@media print{
  body{background:#fff;color:#000}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-size:12pt;line-height:1.8}
  #printArea h1{font-size:18pt;margin-bottom:4pt}
  #printArea .pmeta{color:#555;font-size:10pt;margin-bottom:12pt}
  #printArea .pbody{white-space:pre-wrap;unicode-bidi:plaintext}
  #printArea .pfoot{margin-top:18pt;color:#777;font-size:9pt}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

  cs:          { label: 'علوم حاسوب', ai: 'علوم الحاسوب: ركّز على المفاهيم والخوارزميات وتعقيدها والأمثلة البرمجية' }
};

/* ---------------- أدوات عامة ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
// إنشاء عناصر DOM بأمان: النصوص تُضاف دائماً كعُقد نصية (لا innerHTML لبيانات المستخدم)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#i-' + name); s.append(u); s.setAttribute('aria-hidden', 'true');
  return s;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wc = s => (s.match(/\S+/g) || []).length;
const fmt = (t, o) => t.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function clip(s, n) { s = String(s || '').trim(); if (s.length <= n) return s; const cut = s.slice(0, n); const sp = cut.lastIndexOf(' '); return (sp > n * .6 ? cut.slice(0, sp) : cut) + '…'; }
function clipWords(s, n) { const w = s.split(/\s+/); return w.length <= n ? s : w.slice(0, n).join(' ') + '…'; }

const dateFmt = new Intl.DateTimeFormat('ar-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });

function fmtDate(iso) { try { return dateFmt.format(new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''))); } catch { return iso; } }
const numAr = n => new Intl.NumberFormat('ar-u-nu-latn').format(n);

const LS = {
  mem: {},
  get(k, d) { try { const v = localStorage.getItem('khulasa.' + k); return v == null ? (k in this.mem ? this.mem[k] : d) : JSON.parse(v); } catch { return k in this.mem ? this.mem[k] : d; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem('khulasa.' + k, JSON.stringify(v)); } catch {} },
  del(k) { delete this.mem[k]; try { localStorage.removeItem('khulasa.' + k); } catch {} }
};

/* ---------------- إشعارات ونوافذ ---------------- */
function toast(msg, type = 'info', ms = 3800, action) {
  const t = h('div', { class: 'toast ' + type, role: type === 'error' ? 'alert' : 'status' }, h('span', { class: 'spacer' }, msg));
  if (action) t.append(h('button', { onclick: e => { e.stopPropagation(); action.fn(); t.remove(); } }, action.label));
  t.addEventListener('click', () => t.remove()); // اضغط لإخفاء الرسالة
  const box = $('#toasts');
  if (type === 'ok') box.querySelectorAll('.toast.error').forEach(x => x.remove()); // نجاح العملية يلغي رسالة الخطأ السابقة
  while (box.children.length >= 2) box.firstElementChild.remove(); // رسالتان كحد أقصى حتى لا تغطي المحتوى
  box.append(t);
  setTimeout(() => t.remove(), ms);
}
let modalStack = [];
function openModal(title, body, actions = [], onClose) {
  const back = h('div', { class: 'modal-back', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });

/* ---------------- التخزين (IndexedDB مع بديل في الذاكرة) ---------------- */
const Store = {
  db: null, mem: null,
  async init() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('khulasa', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const s of ['lectures', 'cards', 'glossary']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 6000);
      });
    } catch (e) {
      this.mem = { lectures: new Map(), cards: new Map(), glossary: new Map() };
      toast('تعذّر فتح التخزين الدائم في هذا المتصفح؛ ستبقى بياناتك حتى إغلاق الصفحة فقط. صدّر نسخة احتياطية قبل الخروج.', 'warn', 9000);
    }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const os = t.objectStore(store); let out;
      const r = fn(os); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.mem ? Promise.resolve([...this.mem[s].values()].map(clone)) : this._tx(s, 'readonly', os => os.getAll()); },
  get(s, id) { return this.mem ? Promise.resolve(this.mem[s].has(id) ? clone(this.mem[s].get(id)) : undefined) : this._tx(s, 'readonly', os => os.get(id)); },
  put(s, o) { if (this.mem) { this.mem[s].set(o.id, clone(o)); return Promise.resolve(); } return this._tx(s, 'readwrite', os => os.put(o)); },
  putMany(s, arr) { if (this.mem) { arr.forEach(o => this.mem[s].set(o.id, clone(o))); return Promise.resolve(); } return this._tx(s, 'readwrite', os => { arr.forEach(o => os.put(o)); }); },
  del(s, id) { if (this.mem) { this.mem[s].delete(id); return Promise.resolve(); } return this._tx(s, 'readwrite', os => os.delete(id)); },
  clear(s) { if (this.mem) { this.mem[s].clear(); return Promise.resolve(); } return this._tx(s, 'readwrite', os => os.clear()); }
};

      mcqDef: 'أيّ المصطلحات التالية يطابق التعريف: «{d}»؟', mcqTerm: 'ما التعريف الصحيح لـ«{t}»؟', cloze: 'اختر الكلمة المناسبة لإكمال العبارة: {s}',
      tfSwap: 'تعريف «{t}»: {d}', explainQuote: 'اشرح العبارة التالية بأسلوبك: «{s}»'
    },
    en: {
      general:     { define: 'Define {t}.', diff: 'What is the difference between {a} and {b}?', props: 'List the characteristics of {h}.', explain: 'Explain {h}.' },
      medicine:    { define: 'Define {t}.', diff: 'Compare {a} and {b}.', props: 'List the causes and symptoms related to {h}.', explain: 'What is the mechanism of {h} and its clinical significance?' },
      engineering: { define: 'Define {t}.', diff: 'What is the difference between {a} and {b}?', props: 'List the components of {h} and how it works.', explain: 'Explain how {h} is applied in practice.' },
      law:         { define: 'Define {t} in legal terms.', diff: 'Distinguish between {a} and {b}.', props: 'List the elements or conditions of {h}.', explain: 'What is the legal effect of {h}?' },
      languages:   { define: 'Define {t} and give an example.', diff: 'What is the difference between {a} and {b}?', props: 'State the rules of {h} with examples.', explain: 'Use {h} in a sentence.' },
      cs:          { define: 'Define {t}.', diff: 'What is the difference between {a} and {b}?', props: 'List the properties of {h} and when it is used.', explain: 'Explain how {h} works with an example.' },
      mcqDef: 'Which term matches this definition: “{d}”?', mcqTerm: 'What is the correct definition of “{t}”?', cloze: 'Choose the word that completes the statement: {s}',
      tfSwap: 'Definition of “{t}”: {d}', explainQuote: 'Explain the following statement in your own words: “{s}”'
    }
  };

  function findWord(s, w) {
    const re = new RegExp('(^|[^\\p{L}\\p{N}])(' + escRe(w) + ')(?=$|[^\\p{L}\\p{N}])', 'iu');
    const m = re.exec(s); return m ? { index: m.index + m[1].length, len: m[2].length } : null;
  }
  const jacc = (a, b) => { let i = 0; for (const x of a) if (b.has(x)) i++; return i / (a.size + b.size - i || 1); };

  /* --- التحليل الكامل --- */
  function analyze(text, subject = 'general') {
    const t0 = performance.now();
    const lang = detectLang(text);
    const blocks = parseDoc(text);
    const sections = [], sentences = [];
    let sec = -1;
    for (const b of blocks) {
      if (b.type === 'h') { sections.push({ title: stripDiac(b.text), level: b.level }); sec = sections.length - 1; continue; }
      const parts = b.type === 'li' ? chunkLong(b.text) : splitSentences(b.text);
      for (const p of parts) sentences.push({ t: p, sec, li: b.type === 'li' });
    }
    for (const s of sentences) s.q = textQuality(s.t); // جملة رديئة (ضجيج OCR) لا تدخل الملخص ولا المصطلحات
    // تكرار الكلمات
    const tf = new Map(), forms = new Map(), bi = new Map(), biForms = new Map();
    for (const s of sentences) {
      const toks = contentTokens(s.t);
      s.stems = new Set(toks.map(x => x.stem));
      for (let i = 0; i < toks.length; i++) {
        const k = toks[i].stem; tf.set(k, (tf.get(k) || 0) + 1);
        const f = forms.get(k) || new Map(); f.set(toks[i].surface, (f.get(toks[i].surface) || 0) + 1); forms.set(k, f);
        if (i + 1 < toks.length) {
          const bk = k + ' ' + toks[i + 1].stem; bi.set(bk, (bi.get(bk) || 0) + 1);
          const bf = biForms.get(bk) || new Map(); const sf = toks[i].surface + ' ' + toks[i + 1].surface; bf.set(sf, (bf.get(sf) || 0) + 1); biForms.set(bk, bf);
        }
      }
    }
    const best = m => [...m.entries()].sort((a, b) => b[1] - a[1])[0][0];
    const maxTf = Math.max(1, ...tf.values());
    // التعريفات
    const terms = []; const seenT = new Set(); const defIdx = new Set();
    sentences.forEach((s, i) => {
      if (s.q < 0.6) return;
      const d = extractDef(s.t); if (!d) return;
      const k = norm(d.term); if (seenT.has(k)) return; seenT.add(k); defIdx.add(i);
      terms.push({ ...d, sec: s.sec });
    });
    // تقييم الجمل
    const boost = BOOST[subject];
    const secFirst = new Set(); { let last = -2; sentences.forEach((s, i) => { if (s.sec !== last) { secFirst.add(i); last = s.sec; } }); }
    const headStems = sections.map(x => new Set(contentTokens(x.title).map(t => t.stem)));
    sentences.forEach((s, i) => {
      const n = s.stems.size;
      if (!n || s.q < 0.5) { s.score = 0; return; }
      let sum = 0; for (const w of s.stems) sum += tf.get(w) / maxTf;
      let base = (sum / n) * Math.log2(1 + n);
      let bonus = 0;
      const ns = norm(s.t);
      if (i < 2) bonus += 0.25;
      if (secFirst.has(i)) bonus += 0.2;
      if (i === sentences.length - 1) bonus += 0.1;
      if (CUE.test(ns)) bonus += 0.25;
      if (boost && boost.test(ns)) bonus += 0.2;
      if (defIdx.has(i)) bonus += 0.35;
      if (s.sec >= 0 && headStems[s.sec]) { let o = 0; for (const w of headStems[s.sec]) if (s.stems.has(w)) o++; bonus += Math.min(0.3, o * 0.12); }
      const w = wc(s.t);
      let mult = w < 5 ? 0.35 : w < 8 ? 0.8 : w > 50 ? 0.75 : 1;
      s.score = base * (1 + bonus) * mult;
    });
    const order = sentences.map((_, i) => i).sort((a, b) => sentences[b].score - sentences[a].score);
    function pick(n) {
      if (sentences.length <= n) return sentences.map((_, i) => i);
      const picked = [];
      for (const i of order) {
        if (picked.length >= n) break;
        if (wc(sentences[i].t) < 4 || !sentences[i].score) continue;
        if (picked.some(j => jacc(sentences[i].stems, sentences[j].stems) > 0.5)) continue;
        picked.push(i);
      }
      for (const i of order) { if (picked.length >= n) break; if (!picked.includes(i)) picked.push(i); }
      return picked.sort((a, b) => a - b);
    }
    const summary = { short: pick(5), medium: pick(7), long: pick(10) };
    // الكلمات المفتاحية
    const bigrams = [...bi.entries()].filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => best(biForms.get(k)));
    const unis = [...tf.entries()].filter(([k, c]) => c >= 2 && k.length > 2).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([k]) => best(forms.get(k)));
    const kwSeen = new Set(); const keywords = [];
    for (const k of [...bigrams, ...unis]) { const nk = norm(k); if (kwSeen.has(nk)) continue; kwSeen.add(nk); keywords.push(k); if (keywords.length >= 16) break; }
    // الهيكل
    let outline;
    const topOf = (idxs, n) => idxs.sort((a, b) => sentences[b].score - sentences[a].score).slice(0, n).sort((a, b) => a - b).map(i => clip(stripDiac(sentences[i].t), 170));
    if (sections.length) {
      outline = sections.map((x, si) => {
        const idxs = sentences.map((s, i) => s.sec === si ? i : -1).filter(i => i >= 0);
        return { level: x.level, title: x.title, points: topOf(idxs, 2) };
      });
      const pre = sentences.map((s, i) => s.sec === -1 ? i : -1).filter(i => i >= 0);
      if (pre.length > 2) outline.unshift({ level: 2, title: lang === 'ar' ? 'افتتاحية' : 'Opening', points: topOf(pre, 2), auto: true });
    } else {
      const g = Math.max(1, Math.min(8, Math.ceil(sentences.length / 6)));
      const size = Math.ceil(sentences.length / g) || 1;
      outline = [];
      for (let k = 0; k < sentences.length; k += size) {
        const idxs = []; for (let i = k; i < Math.min(sentences.length, k + size); i++) idxs.push(i);
        const cnt = new Map(); idxs.forEach(i => sentences[i].stems.forEach(w => cnt.set(w, (cnt.get(w) || 0) + 1)));
        const top = [...cnt.entries()].sort((a, b) => (b[1] * tf.get(b[0])) - (a[1] * tf.get(a[0]))).slice(0, 2).map(([w]) => best(forms.get(w)));
        outline.push({ level: 2, title: top.join(lang === 'ar' ? ' و' : ' & ') || '…', points: topOf(idxs, 2), auto: true });
      }
    }
    const out = {
      lang, wordCount: wc(text), ms: 0,
      sentences: sentences.map(s => ({ t: s.t, sec: s.sec })), sections, summary, terms: terms.slice(0, 40), keywords, outline,
      _scores: sentences.map(s => s.score)
    };
    out.questions = genQuestions(out, subject);
    delete out._scores;
    out.ms = Math.round(performance.now() - t0);
    return out;
  }

  /* --- توليد الأسئلة --- */
  function genQuestions(an, subject) {
    const L = an.lang === 'en' ? 'en' : 'ar';
    const tp = QT[L][subject] || QT[L].general, g = QT[L];
    const open = [], mcq = [], tf = [];
    const terms = an.terms;
    terms.slice(0, 8).forEach(t => open.push({ q: fmt(tp.define, { t: t.term }), a: t.def }));
    const pairs = [];
    const bySec = new Map(); terms.forEach(t => { const a = bySec.get(t.sec) || []; a.push(t); bySec.set(t.sec, a); });
    for (const arr of bySec.values()) for (let i = 0; i + 1 < arr.length && pairs.length < 3; i += 2) pairs.push([arr[i], arr[i + 1]]);
    for (let i = 0; pairs.length < Math.min(3, Math.floor(terms.length / 2)) && i + 1 < terms.length; i += 2) if (!pairs.some(p => p.includes(terms[i]))) pairs.push([terms[i], terms[i + 1]]);
    pairs.forEach(([a, b]) => open.push({ q: fmt(tp.diff, { a: a.term, b: b.term }), a: a.term + ': ' + a.def + '\n' + b.term + ': ' + b.def }));
    const heads = an.outline.filter(o => !o.auto && o.points.length && !SKIP_HEAD.test(norm(o.title).trim()) && wc(o.title) <= 8).slice(0, 5);
    heads.forEach((o, i) => open.push({ q: fmt(i % 2 ? tp.explain : tp.props, { h: o.title }), a: o.points.join('\n') }));
    const top = an.summary.long.map(i => stripDiac(an.sentences[i].t));
    if (open.length < 3) top.slice(0, 3 - open.length).forEach(s => open.push({ q: fmt(g.explainQuote, { s: clip(s, 160) }), a: s }));

    // اختيار من متعدد: تعريف ↔ مصطلح
    if (terms.length >= 2) {
      shuffle(terms).slice(0, 5).forEach((t, i) => {
        const others = shuffle(terms.filter(x => x !== t)).slice(0, 3);
        if (i % 2 === 0) {
          const d = clip(t.def, 150).replace(new RegExp(escRe(t.term), 'gi'), '…');
          const options = shuffle([t.term, ...others.map(o => o.term)]);
          mcq.push({ q: fmt(g.mcqDef, { d }), options, answer: options.indexOf(t.term) });
        } else {
          const right = clip(t.def, 110);
          const options = shuffle([right, ...others.map(o => clip(o.def, 110))]);
          mcq.push({ q: fmt(g.mcqTerm, { t: t.term }), options, answer: options.indexOf(right) });
        }
      });
    }
    // إكمال الفراغ من الجمل المفتاحية
    const kws = an.keywords;
    const sameScript = (a, b) => isAr(a) === isAr(b);
    for (const s of top) {
      if (mcq.length >= 8 || kws.length < 3) break;
      const kw = kws.find(k => findWord(s, k));
      if (!kw) continue;
      const pos = findWord(s, kw);
      const blanked = s.slice(0, pos.index) + '_____' + s.slice(pos.index + pos.len);
      const distract = shuffle(kws.filter(k => k !== kw && !findWord(s, k) && sameScript(k, kw) && norm(k) !== norm(kw))).slice(0, 3);
      if (distract.length < 2) continue;
      const options = shuffle([kw, ...distract]);
      mcq.push({ q: fmt(g.cloze, { s: clip(blanked, 220) }), options, answer: options.indexOf(kw) });
    }
    // صح أو خطأ
    const pool = top.filter(s => wc(s) >= 5 && wc(s) <= 40);
    pool.forEach((s, k) => {
      if (tf.length >= 6) return;
      if (k % 2 === 1) {
        const kw = kws.find(x => findWord(s, x));
        const rep = kw && shuffle(kws).find(x => x !== kw && !findWord(s, x) && sameScript(x, kw) && norm(x) !== norm(kw));
        if (kw && rep) { const p = findWord(s, kw); tf.push({ s: s.slice(0, p.index) + rep + s.slice(p.index + p.len), answer: false, fix: s }); return; }
      }
      tf.push({ s, answer: true });
    });
    if (terms.length >= 2 && tf.filter(x => !x.answer).length < 3) {
      const [a, b] = shuffle(terms);
      tf.push({ s: fmt(g.tfSwap, { t: a.term, d: clip(b.def, 160) }), answer: false, fix: a.term + ': ' + a.def });
    }
    return { open, mcq, tf: shuffle(tf), lang: L };
  }

  /* --- مطابقة القاموس --- */
  // يعيد مواضع المصطلحات في النص الأصلي (لعرض المعنى بجانب كل مصطلح دون إنترنت)
  function glossaryScan(text, entries) {
    const index = new Map();
    const add = (k, e) => { if (!k || k.length < 2) return; const a = index.get(k) || []; if (!a.includes(e)) a.push(e); index.set(k, a); };
    for (const e of entries) {
      const en = norm(e.en || ''), ar = norm(e.ar || '');
      add(en, e); add(ar, e); if (ar.startsWith('ال')) add(ar.slice(2), e);
      if (en.endsWith('s')) add(en.slice(0, -1), e); else add(en + 's', e);
    }
    const toks = []; for (const m of text.matchAll(WORD_RE)) toks.push({ n: norm(m[0]), s: m.index, e: m.index + m[0].length });
    const hits = [];
    for (let i = 0; i < toks.length; i++) {
      for (let n = 3; n >= 1; n--) {
        if (i + n > toks.length) continue;
        const key = toks.slice(i, i + n).map(t => t.n).join(' ');
        let hit = index.get(key);
        if (!hit && /^(ال|وال|بال|لل|و)/.test(key)) hit = index.get(key.replace(/^(وال|بال|كال|فال|ال|لل|و)/, ''));
        if (hit) { hits.push({ s: toks[i].s, e: toks[i + n - 1].e, list: hit }); i += n - 1; break; }
      }
    }
    return hits;
  }
  function glossaryMatches(text, entries) {
    const found = new Map();
    for (const hit of glossaryScan(text, entries)) for (const e of hit.list) { const f = found.get(e.id) || { e, count: 0 }; f.count++; found.set(e.id, f); }
    return [...found.values()].sort((a, b) => b.count - a.count);
  }

  // جودة السطر من 0 إلى 1: هل يشبه كلاماً حقيقياً أم ضجيجاً من القراءة الضوئية؟
  const SHORT_OK = /^(و|في|من|عن|أو|او|ان|أن|إن|لا|ما|هو|هي|قد|ثم|بل|كل|لم|لن|يا|a|an|of|to|in|is|on|at|by|or|as|it|be|we|if|no|so|do|up|he|me|us|vs|i|e|g|dr)$/i;
  function textQuality(s) {
    const t = String(s).trim(); if (!t) return 0;
    const nonsp = (t.match(/\S/g) || []).length, letters = (t.match(/\p{L}/gu) || []).length;
    const toks = t.split(/\s+/).map(x => x.replace(/[^\p{L}\p{M}]/gu, '')).filter(Boolean);
    if (!toks.length) return 0;
    const short = toks.filter(x => x.length <= 2 && !SHORT_OK.test(x)).length / toks.length;
    const mixed = toks.filter(x => /[؀-ۿ]/.test(x) && /[A-Za-z]/.test(x)).length / toks.length;
    const lat = toks.filter(x => /^[A-Za-z]{2,}$/.test(x));
    const noVowel = lat.length ? lat.filter(x => !/[aeiouyAEIOUY]/.test(x) && !/^[A-Z]{2,5}$/.test(x)).length / toks.length : 0;
    // كلمات قصيرة من اللغة الأخرى وسط السطر (مثل «Nucleus الا و») أو حروف كبيرة داخل الكلمة («magniliL») علامة ضجيج
    const arT = toks.filter(x => /[؀-ۿ]/.test(x)), laT = toks.filter(x => /[A-Za-z]/.test(x));

    return Math.max(0, (letters / nonsp) * (1 - Math.max(0, short - 0.25)) * (1 - mixed) * (1 - noVowel) * (1 - Math.min(1, minorShort * 1.5)) * (1 - oddCase));
  }

  return { analyze, genQuestions, detectLang, norm, stripDiac, glossaryMatches, glossaryScan, isAr, extractDef, wc, textQuality };
})();

      Busy.hide();

    }
    const pages = [], empty = [];
    for (let p = from; p <= to; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const t = pdfItemsToText(tc.items);
      if (t.replace(/\s/g, '').length < 25) empty.push(p);
      pages.push(t);
      page.cleanup();
      Busy.update('جارٍ قراءة الصفحة ' + numAr(p) + ' من ' + numAr(to), (p - from + 1) / (to - from + 1));
    }
    const text = pages.join('\n\n').trim();
    const total = to - from + 1;
    // صفحات بلا نص (ممسوحة ضوئياً): نقترح قراءتها بالتعرف الضوئي
    if (empty.length > total * 0.5) {
      Busy.hide();
      const max = 15, list = empty.slice(0, max);
      const ok = await confirmDialog('يبدو أن ' + (empty.length === total ? 'هذا الملف ممسوح ضوئياً (صور بلا نص)' : numAr(empty.length) + ' من صفحاته ممسوحة ضوئياً') + '. هل تريد استخراج النص بالتعرف الضوئي (OCR)؟ ' + (empty.length > max ? 'ستُقرأ أول ' + numAr(max) + ' صفحة منها. ' : '') + 'تستغرق كل صفحة بضع ثوانٍ.', 'نعم، استخرج');

      const render = n => async () => {
        const page = await doc.getPage(n); const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; page.cleanup(); return c;

    console.warn(e);
    toast(e && e.name === 'PasswordException' ? 'ملف PDF محمي بكلمة مرور. افتحه واحفظه دون كلمة مرور ثم ارفعه.' : e && e.message === 'timeout' ? 'استغرقت قراءة الملف وقتاً طويلاً. جرّب ملفاً أصغر أو اختر صفحات أقل.' : 'تعذّرت قراءة ملف PDF. قد يكون تالفاً.', 'error', 7000);
    return null;

}

  if (name.endsWith('.docx') || file.type.includes('wordprocessingml')) { appendToInput(await readOffice(file, 'docx'), 'ملف Word'); return; }
  if (name.endsWith('.pptx') || file.type.includes('presentationml')) { appendToInput(await readOffice(file, 'pptx'), 'ملف PowerPoint'); return; }
  if (/\.(rtf|odt|odp)$/.test(name)) { toast('هذه صيغة قديمة غير مدعومة. افتح الملف واحفظه بصيغة docx أو pptx أو PDF ثم ارفعه.', 'warn', 7000); return; } // ويندوز يسمّي rtf بنوع Word
  if (name.endsWith('.ppt') || file.type === 'application/vnd.ms-powerpoint') { appendToInput(await readOffice(file, 'ppt'), 'ملف PowerPoint'); return; }
  if (name.endsWith('.doc') || file.type === 'application/msword') { appendToInput(await readOffice(file, 'doc'), 'ملف Word'); return; }
  if (file.type.startsWith('image/')) { const t = await ocrSources([file]); appendToInput(t, 'الصورة'); return; }
  if (/\.(txt|md|markdown|text|csv)$/.test(name) || file.type.startsWith('text/')) {
    appendToInput(await readTextFile(file), 'الملف'); return;
  }
  toast('صيغة الملف غير مدعومة. استخدم PDF أو Word أو PowerPoint أو txt أو صورة.', 'warn', 6000);
}

const Speech = {
  rec: null, on: false, started: 0, timer: null, finalText: '',
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  start() {
    if (!this.supported()) {
      openModal('التسجيل الصوتي غير متاح', h('p', { text: 'متصفحك لا يدعم تحويل الصوت إلى نص. استخدم متصفح Chrome على Android أو الحاسوب. ملاحظة: هذه الميزة تحتاج إنترنت في معظم المتصفحات.' }), [{ label: 'حسناً', cls: 'btn-primary', fn: () => {} }]);
      return;
    }
    if (!navigator.onLine) toast('أنت غير متصل؛ التحويل الصوتي يحتاج إنترنت في معظم المتصفحات وقد لا يعمل الآن.', 'warn', 6000);
    else if (!LS.get('speechNote', false)) { toast('ملاحظة: يُرسل المتصفح الصوت إلى خدمة التعرف على الكلام الخاصة به (مثل Google في Chrome) لتحويله إلى نص.', 'info', 7000); LS.set('speechNote', true); }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR(); this.rec = r;
    r.lang = $('#recLang').value; r.continuous = true; r.interimResults = true;
    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) { const t = res[0].transcript.trim(); if (t) this.push(t); } else interim += res[0].transcript;
      }
      $('#recInterim').textContent = interim;
    };
    r.onerror = e => {
      const m = { 'not-allowed': 'اسمح للتطبيق باستخدام الميكروفون من إعدادات المتصفح.', 'service-not-allowed': 'اسمح للتطبيق باستخدام الميكروفون من إعدادات المتصفح.', 'network': 'التحويل الصوتي يحتاج اتصالاً بالإنترنت في هذا المتصفح.', 'audio-capture': 'لم يُعثر على ميكروفون يعمل.', 'language-not-supported': 'اللغة المختارة غير مدعومة في هذا المتصفح.' }[e.error];
      if (m) { toast(m, 'error', 6500); this.stop(); }
    };
    r.onend = () => { if (this.on) { try { r.start(); } catch { this.stop(); } } };
    try { r.start(); } catch { toast('تعذّر بدء التسجيل. أعد المحاولة.', 'error'); return; }
    this.on = true; this.started = Date.now();
    $('#recPanel').classList.remove('hidden'); $('#recInterim').textContent = '';
    this.timer = setInterval(() => { const s = Math.floor((Date.now() - this.started) / 1000); $('#recTime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  },
  push(t) { const ta = $('#lectureText'); const sep = ta.value && !/\s$/.test(ta.value) ? ' ' : ''; ta.value += sep + t + (/[.؟?!]$/.test(t) ? '' : '.'); ta.dispatchEvent(new Event('input')); },
  stop() {
    this.on = false; clearInterval(this.timer);
    try { this.rec && this.rec.stop(); } catch {}
    $('#recPanel').classList.add('hidden');
  }
};

const SAMPLE = `# الخلية: وحدة الحياة الأساسية

## مقدمة
تُعدّ الخلية الوحدة الأساسية للتركيب والوظيفة في جميع الكائنات الحية. اكتشف العالم روبرت هوك الخلية عام 1665 عندما فحص شريحة من الفلين بالمجهر. ومنذ ذلك الحين تطورت نظرية الخلية التي تنص على أن جميع الكائنات الحية تتكون من خلايا، وأن الخلية تنشأ من خلية سابقة.

## أنواع الخلايا
تنقسم الخلايا إلى نوعين رئيسيين هما الخلايا بدائية النواة والخلايا حقيقية النواة.
الخلايا بدائية النواة (Prokaryotic cells) هي خلايا لا تحتوي على نواة محاطة بغشاء، مثل البكتيريا.
الخلايا حقيقية النواة (Eukaryotic cells) هي خلايا تحتوي على نواة حقيقية وعضيات محاطة بأغشية، مثل خلايا الإنسان والنبات.

## مكونات الخلية
الغشاء الخلوي (Cell membrane) هو غلاف رقيق يحيط بالخلية وينظم دخول المواد وخروجها.
النواة (Nucleus) هي مركز التحكم في الخلية وتحتوي على المادة الوراثية DNA.
الميتوكوندريا (Mitochondria) هي عضيات تنتج الطاقة اللازمة للخلية عن طريق التنفس الخلوي، ولذلك تسمى بيت الطاقة.
الريبوسومات (Ribosomes) هي عضيات صغيرة مسؤولة عن تصنيع البروتين.
السيتوبلازم: مادة هلامية تملأ الخلية وتسبح فيها العضيات.

## وظائف الخلية
تقوم الخلية بعدة وظائف حيوية أهمها إنتاج الطاقة وتصنيع البروتين والانقسام. ويُعرّف الانقسام الخلوي بأنه العملية التي تنتج بها الخلية خليتين جديدتين. ومن المهم أن نعرف أن خلل الانقسام قد يؤدي إلى أمراض خطيرة مثل السرطان.

## الخلاصة
الخلية نظام متكامل تعمل مكوناته معاً للحفاظ على الحياة. لذلك يجب على الطالب فهم وظيفة كل عضية وعلاقتها ببقية المكونات.`;

function schedule(c, grade) {
  const n = { ...c };
  if (grade === 0) { n.reps = 0; n.interval = 0; n.ease = Math.max(1.3, c.ease - 0.2); n.due = Date.now() + 10 * 60000; return n; }
  if (grade === 1) { n.ease = Math.max(1.3, c.ease - 0.15); n.interval = Math.max(1, Math.round((c.interval || 1) * 1.2)); }
  else {
    const good = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.interval * c.ease);
    n.interval = grade === 3 ? Math.max(2, Math.round(good * 1.4)) : good;
    if (grade === 3) n.ease = c.ease + 0.15;
  }
  n.reps = c.reps + 1; n.due = Date.now() + n.interval * DAY; return n;
}

});

  // أولاً: تسجيل عامل الخدمة (التثبيت والعمل دون إنترنت) قبل أي خطوة قد تتأخر
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  applyTheme(); applyFont(); updateNet(false);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  await Store.init();
  try { navigator.storage?.persist?.(); } catch {} // اطلب من المتصفح ألا يحذف بيانات الطالب تلقائياً
  await loadGlossary();
  const draft = LS.get('draft', ''); if (draft) { ta.value = draft; ta.dispatchEvent(new Event('input')); }
  try { history.replaceState({ view: 'new' }, ''); } catch {}
  refreshDue();
  setInterval(refreshDue, 60000);
  window.Khulasa = { NLP, Store, AI, Pomo, state, version: APP_VERSION }; // للاختبار والتشخيص
})();
</script>
